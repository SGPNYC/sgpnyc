<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services — SGP International</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #1a3557; --blue-heading: #1d4e7a; --green: #3d8a4e; --green-hover: #2e6e3c; --bg: #e8e5df; --bg-white: #f4f3f1; --text: #444; --text-dark: #1a1a1a; --border: #d5d2cc; }
    body { font-family: 'DM Sans', sans-serif; background: #fff; color: var(--text-dark); }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 70px; background: rgba(0,0,0,0.22); backdrop-filter: blur(4px); }
    .nav-logo img { height: 64px; }
    .nav-links { display: flex; align-items: center; gap: 36px; list-style: none; }
    .nav-links a { color: #fff; text-decoration: none; font-size: 17px; transition: opacity 0.2s; }
    .nav-links a:hover { opacity: 0.7; }
    .nav-cta { background: var(--green) !important; color: #fff !important; padding: 10px 22px; border-radius: 30px; font-weight: 500 !important; }
    .nav-cta:hover { background: var(--green-hover) !important; opacity: 1 !important; }
    .has-dropdown { position: relative; }
    .dropdown-btn { background: none; border: none; color: #fff; font-size: 17px; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 0; }
    .arrow { font-size: 12px; transition: transform 0.2s; display: inline-block; }
    .dropdown-menu { display: none; position: absolute; top: 100%; padding-top: 8px; left: 0; background: rgba(20,20,20,0.96); border-radius: 4px; list-style: none; min-width: 180px; padding: 8px 0; box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 200; }
    .has-dropdown:hover .dropdown-menu, .has-dropdown:focus-within .dropdown-menu, .has-dropdown.open .dropdown-menu { display: block; }
    .has-dropdown:hover .arrow { transform: rotate(180deg); }
    .dropdown-menu li a { display: block; padding: 10px 20px; color: #fff; text-decoration: none; font-size: 17px; }
    .dropdown-menu li a:hover { background: rgba(255,255,255,0.1); }

    .page-hero { margin-top: 0; height: 570px; background-image: url('/images/site/hero-services.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; position: relative; }
    .page-hero::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.1); }
    .page-hero h1 { position: relative; z-index: 2; font-family: 'Manrope', sans-serif; font-size: clamp(36px, 5vw, 60px); font-weight: 700; letter-spacing: 0.15em; color: #fff; }

    .section { padding: 80px 60px; text-align: center; }
    .section img { max-width: 100%; }

    footer { background: #1a1a1a; color: #888; text-align: center; padding: 24px 40px; font-size: 13px; }

    @media (max-width: 600px) { nav { padding: 0 20px; } .section { padding: 60px 24px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/"><img src="/images/site/sgpGlobe.webp" alt="SGP International" /></a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li class="has-dropdown">
      <button class="dropdown-btn">SGP International <span class="arrow">&#8964;</span></button>
      <ul class="dropdown-menu">
        <li><a href="/abt/">About SGP</a></li>
        <li><a href="/services/">Services</a></li>
        <li><a href="/products/">Products</a></li>
        <li><a href="/success/">Success Stories</a></li>
        <li><a href="/partners/">Customers</a></li>
        <li><a href="/new-page/">Personal Paper</a></li>
              </ul>
    </li>
    <li><a href="/blog/">Blog</a></li>
        <li><a href="/games/">Games</a></li>
        <li><a href="/#contact" class="nav-cta">Contact</a></li>
  </ul>
</nav>

<div class="page-hero"><h1>CONSULTING SERVICES</h1></div>

<section class="section">
  <img src="/images/site/sgpconsult.png" alt="SGP Consulting Services" />
</section>

<footer><p>©SGP International</p></footer>

<script>
  document.querySelectorAll('.dropdown-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const li = this.closest('.has-dropdown');
      const isOpen = li.classList.contains('open');
      document.querySelectorAll('.has-dropdown.open').forEach(el => el.classList.remove('open'));
      if (!isOpen) li.classList.add('open');
    });
  });
  document.addEventListener('click', () => document.querySelectorAll('.has-dropdown.open').forEach(el => el.classList.remove('open')));
</script>
</body>
</html>
