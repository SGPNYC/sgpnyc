<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About SGP — SGP International</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue-heading: #1d4e7a; --green: #3d8a4e; --green-hover: #2e6e3c; --bg: #f4f3f1; }
    body { font-family: 'DM Sans', sans-serif; background: #fff; color: #1a1a1a; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 70px; background: rgba(0,0,0,0.22); backdrop-filter: blur(4px); }
    .nav-logo img { height: 64px; }
    .nav-links { display: flex; align-items: center; gap: 36px; list-style: none; }
    .nav-links a { color: #fff; text-decoration: none; font-size: 17px; transition: opacity 0.2s; }
    .nav-links a:hover { opacity: 0.7; }
    .nav-cta { background: var(--green); color: #fff !important; padding: 10px 22px; border-radius: 30px; font-weight: 500 !important; }
    .nav-cta:hover { background: var(--green-hover) !important; opacity: 1 !important; }
    .has-dropdown { position: relative; }
    .dropdown-btn { background: none; border: none; color: #fff; font-size: 17px; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 0; }
    .arrow { font-size: 12px; transition: transform 0.2s; display: inline-block; }
    .dropdown-menu { display: none; position: absolute; top: 100%; padding-top: 16px; left: 0; background: rgba(20,20,20,0.96); border-radius: 4px; list-style: none; min-width: 180px; padding: 8px 0; box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 200; }
    .has-dropdown:hover .dropdown-menu, .has-dropdown:focus-within .dropdown-menu, .has-dropdown.open .dropdown-menu { display: block; }
    .has-dropdown:hover .arrow { transform: rotate(180deg); }
    .dropdown-menu li a { display: block; padding: 10px 20px; color: #fff; text-decoration: none; font-size: 17px; }
    .dropdown-menu li a:hover { background: rgba(255,255,255,0.1); }

    /* HERO */
    .page-hero {
      margin-top: 0; height: 570px;
      background-image: url('/images/site/hero-abt.jpg');
      background-size: cover; background-position: center top;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .page-hero::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.1); }
    .page-hero h1 { position: relative; z-index: 2; font-family: 'Manrope', sans-serif; font-size: 52px; font-weight: 700; letter-spacing: 0.15em; color: #fff; }

    /* CONTENT */
    .content { max-width: 860px; margin: 0 auto; padding: 70px 40px 100px; text-align: center; }

    .sgp-logo-lockup {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 36px;
    }
    .sgp-logo-lockup img { height: 180px; margin-bottom: 8px; }
    .sgp-tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; letter-spacing: 0.3em; color: var(--green);
      text-transform: uppercase; font-weight: 600;
    }

    .since {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 400; color: var(--blue-heading);
      margin-bottom: 20px; line-height: 1.3;
    }
    .since strong { font-weight: 700; }

    .sectors {
      font-size: 12px; font-weight: 600; letter-spacing: 0.12em;
      color: var(--green); text-transform: uppercase;
      margin-bottom: 24px;
    }

    .mission-text {
      font-size: 17px; line-height: 1.75; color: #444;
      max-width: 620px; margin: 0 auto 60px;
      text-align: center;
    }

    /* THREE PILLARS */
    .pillars {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 32px; margin-bottom: 70px; text-align: left;
      border-top: 1px solid #ddd; padding-top: 40px;
    }
    .pillar h3 { font-size: 16px; font-weight: 600; color: var(--green); margin-bottom: 12px; }
    .pillar p { font-size: 13px; line-height: 1.75; color: #555; }

    /* FLAGSHIP */
    .flagship-title {
      font-size: 14px; font-weight: 600; color: #888;
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 32px; text-align: left;
      border-top: 1px solid #ddd; padding-top: 40px;
    }

    .products-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 24px; text-align: center;
    }

    .product-card img {
      width: 90px; height: 90px; object-fit: contain;
      margin-bottom: 12px; border-radius: 50%;
    }

    .product-card h4 { font-size: 13px; font-weight: 700; color: var(--blue-heading); margin-bottom: 8px; }
    .product-card p { font-size: 12px; line-height: 1.7; color: #666; }

    .about-image-section { padding: 0 60px 80px; text-align: center; }
    .about-image-section img { max-width: 100%; }

    footer { background: #1a1a1a; color: #888; text-align: center; padding: 24px 40px; font-size: 13px; }

    @media (max-width: 700px) {
      .pillars { grid-template-columns: 1fr; }
      .products-grid { grid-template-columns: repeat(2, 1fr); }
      .content { padding: 40px 24px 60px; }
      .about-image-section { padding: 0 24px 60px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/"><img src="/images/site/sgpGlobe.webp" alt="SGP International" /></a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li class="has-dropdown">
      <button class="dropdown-btn">SGP International <span class="arrow">&#8964;</span></button>
      <ul class="dropdown-menu">
        <li><a href="/abt/">About SGP</a></li>
        <li><a href="/services/">Services</a></li>
        <li><a href="/products/">Products</a></li>
        <li><a href="/success/">Success Stories</a></li>
        <li><a href="/partners/">Customers</a></li>
        <li><a href="/new-page/">Personal Paper</a></li>
              </ul>
    </li>
    <li><a href="/blog/">Blog</a></li>
    <li><a href="/games/">Games</a></li>
    <li><a href="/#contact" class="nav-cta">Contact</a></li>
  </ul>
</nav>

<div class="page-hero">
  <h1>ABOUT SGP</h1>
</div>

<div class="content">
  <img src="/images/site/sgp35.png" alt="SGP 35 years" style="height:130px;margin-bottom:24px;" />
  <h2 class="since">SGP has been operating in NYC<br>since <strong>1987</strong></h2>
</div>

<section class="about-image-section">
  <img src="/images/site/sgpAbout.png" alt="SGP International" />
</section>

<footer><p>©SGP International</p></footer>
<script>
  document.querySelectorAll('.dropdown-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const li = this.closest('.has-dropdown');
      const isOpen = li.classList.contains('open');
      document.querySelectorAll('.has-dropdown.open').forEach(el => el.classList.remove('open'));
      if (!isOpen) li.classList.add('open');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.has-dropdown.open').forEach(el => el.classList.remove('open'));
  });
</script>
</body>
</html>
